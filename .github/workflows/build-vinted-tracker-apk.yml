name: Build Vinted Deal Tracker APK

on:
  push:
    branches: [vinted-deal-tracker-apk]
    paths:
      - 'android-app.tar.gz.b64'
      - '.github/workflows/build-vinted-tracker-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore Android source
        run: |
          base64 -d android-app.tar.gz.b64 > android-app.tar.gz
          tar -xzf android-app.tar.gz

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        working-directory: android-app
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Prepare artifact
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk VintedDealTracker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VintedDealTracker-APK
          path: VintedDealTracker.apk
          if-no-files-found: error
          retention-days: 30
