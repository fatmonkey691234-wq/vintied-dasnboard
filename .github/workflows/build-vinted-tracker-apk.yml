name: Build Vinted Deal Tracker APK

on:
  push:
    branches: [vinted-deal-tracker-apk]
    paths:
      - 'android-app.tar.gz.b64'
      - '.github/workflows/build-vinted-tracker-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore Android source
        run: |
          base64 -d android-app.tar.gz.b64 > android-app.tar.gz
          tar -xzf android-app.tar.gz
          sed -i 's/setTypeface(t.getTypeface(),1)/setTypeface(t.getTypeface(), android.graphics.Typeface.BOLD)/' android-app/app/src/main/java/uk/co/aston/vinteddealtracker/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        working-directory: android-app
        run: gradle testDebugUnitTest --stacktrace

      - name: Run Android lint
        working-directory: android-app
        run: gradle lintDebug --stacktrace

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Verify APK signature and alignment
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -c -v 4 "$APK"

      - name: Prepare artifact
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk VintedDealTracker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VintedDealTracker-APK
          path: VintedDealTracker.apk
          if-no-files-found: error
          retention-days: 30
